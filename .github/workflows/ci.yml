name: PALA validation and optional single APK
on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: Build one isolated test APK after validation passes
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pala-f123-validation
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - name: Format and record patch
        run: |
          dart format lib test
          git diff --binary > /tmp/pala-format.patch
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test new behavior and affected regressions
        run: flutter test test/pala_knowledge_sources_test.dart test/pala_hosting_integration_test.dart test/zim_test.dart test/archive_regressions_test.dart test/device_model_server_test.dart
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Android integration without producing APK
        run: bash scripts/check_android_host.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pala-validation-format
          path: /tmp/pala-format.patch
  android:
    if: inputs.build_apk
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - run: bash scripts/build_android.sh
      - name: Verify isolated package
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$aapt" dump badging "$apk" | grep -F "package: name='ir.pardis.ai.pala.f123test'"
          sha256sum "$apk" > build/app/outputs/flutter-apk/app-release.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PALA-F123-0.3.0-isolated-test
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.sha256
