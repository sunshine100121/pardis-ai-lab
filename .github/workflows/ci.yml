name: PALA validation and optional single APK
on:
  push:
    branches: [pala/f1-f2-f3-2026-11-09]
    paths:
      - .github/workflows/ci.yml
      - lib/features/hosting/**
      - android/app/src/main/kotlin/app/ondevicellm/ondevice_llm/PalaDiagnostics.kt
      - test/device_model_server_test.dart
    # Pushes run validation only; an APK requires explicit workflow_dispatch.
  workflow_dispatch:
    inputs:
      build_apk:
        description: Build one isolated test APK after validation passes
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pala-f123-validation
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - name: Format and record patch
        run: |
          dart format lib test
          git diff --binary > /tmp/pala-format.patch
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test new behavior and affected regressions
        run: flutter test test/pala_knowledge_sources_test.dart test/pala_hosting_integration_test.dart test/pala_sources_ui_test.dart test/zim_test.dart test/archive_regressions_test.dart test/device_model_server_test.dart
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Android integration without producing APK
        run: bash scripts/check_android_host.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pala-validation-format
          path: /tmp/pala-format.patch
  android:
    if: inputs.build_apk == true
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - name: Configure optional diagnostic signing
        env:
          KEYSTORE_BASE64: ${{ secrets.PALA_F1_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PALA_F1_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PALA_F1_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PALA_F1_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64$STORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]]; then
            test -n "$KEYSTORE_BASE64" || { echo "Incomplete PALA_F1 signing secrets" >&2; exit 1; }
            test -n "$STORE_PASSWORD" || { echo "Incomplete PALA_F1 signing secrets" >&2; exit 1; }
            test -n "$KEY_ALIAS" || { echo "Incomplete PALA_F1 signing secrets" >&2; exit 1; }
            test -n "$KEY_PASSWORD" || { echo "Incomplete PALA_F1 signing secrets" >&2; exit 1; }
            keystore="$RUNNER_TEMP/pala-f1diag2-release.p12"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            test -s "$keystore"
            chmod 600 "$keystore"
            {
              printf 'ODLLM_ANDROID_KEYSTORE_PATH=%s\n' "$keystore"
              printf 'ODLLM_ANDROID_STORE_TYPE=PKCS12\n'
              printf 'ODLLM_ANDROID_STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
              printf 'ODLLM_ANDROID_KEY_ALIAS=%s\n' "$KEY_ALIAS"
              printf 'ODLLM_ANDROID_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
              printf 'ODLLM_REQUIRE_RELEASE_SIGNING=true\n'
            } >> "$GITHUB_ENV"
          else
            echo "No persistent key configured; using a temporary Android Debug signer for f1diag2."
          fi
      - name: Select independent diagnostic package
        run: printf 'diagnostic2=true\n' > native/build.properties
      - run: bash scripts/build_android.sh
      - name: Verify independent diagnostic APK
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$aapt" dump badging "$apk" | grep -F "package: name='ir.pardis.ai.pala.f1diag2'"
          "$aapt" dump badging "$apk" | grep -F "application-label:'PALA F1 تشخیصی ۲'"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose "$apk"
          "$apksigner" verify --print-certs "$apk" > build/app/outputs/flutter-apk/app-release-signing.txt
          sha256sum "$apk" > build/app/outputs/flutter-apk/app-release.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PALA-F1-independent-diagnostic2
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.sha256
            build/app/outputs/flutter-apk/app-release-signing.txt
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/pala-f1diag2-release.p12"
