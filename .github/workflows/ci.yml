name: PALA validation and optional single APK
on:
  push:
    branches: [pala/f1-f2-f3-2026-11-09]
    paths: [.github/workflows/ci.yml]
    # This scoped push trigger builds one APK after the test job passes.
  workflow_dispatch:
    inputs:
      build_apk:
        description: Build one isolated test APK after validation passes
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pala-f123-validation
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - name: Format and record patch
        run: |
          dart format lib test
          git diff --binary > /tmp/pala-format.patch
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test new behavior and affected regressions
        run: flutter test test/pala_knowledge_sources_test.dart test/pala_hosting_integration_test.dart test/pala_sources_ui_test.dart test/zim_test.dart test/archive_regressions_test.dart test/device_model_server_test.dart
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Android integration without producing APK
        run: bash scripts/check_android_host.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pala-validation-format
          path: /tmp/pala-format.patch
  android:
    if: inputs.build_apk || github.event_name == 'push'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - name: Select independent diagnostic package
        run: printf 'diagnostic=true\n' > native/build.properties
      - run: bash scripts/build_android.sh
      - name: Verify independent diagnostic APK
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$aapt" dump badging "$apk" | grep -F "package: name='ir.pardis.ai.pala.f1diag'"
          "$aapt" dump badging "$apk" | grep -F "application-label:'PALA F1 تشخیصی'"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose "$apk"
          "$apksigner" verify --print-certs "$apk" > build/app/outputs/flutter-apk/app-release-signing.txt
          sha256sum "$apk" > build/app/outputs/flutter-apk/app-release.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PALA-F1-independent-diagnostic
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.sha256
            build/app/outputs/flutter-apk/app-release-signing.txt
