name: PALA offline MVP validation only
on:
  push:
    branches: [pala/offline-mvp-020-2026-11-14]
    paths: ['lib/**', 'test/**', 'android/**', 'scripts/**', 'pubspec*', '.github/workflows/ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pala-offline-mvp-validation
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 78009a6f2d91ef56942bd929b3f2f289da1d212e
      - uses: actions/checkout@v4
        with:
          path: validation-tests
      - name: Use explicit system-locale fixture and Persian acceptance checks
        run: |
          cp validation-tests/test/l10n_test.dart test/l10n_test.dart
          cp validation-tests/test/persian_overlay_test.dart test/persian_overlay_test.dart
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - name: Validate restored Persian baseline and existing model/native contracts
        run: flutter test test/l10n_test.dart test/persian_overlay_test.dart test/native_load_settings_test.dart test/native_loader_test.dart test/model_load_progress_test.dart test/model_memory_test.dart
  mvp:
    needs: baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check_offline_baseline.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Prepare the locked PDFium native asset for the Linux test runner
        run: |
          dart run scripts/prepare_pdfium_assets.dart
          pdfium=$(find "$PWD/.dart_tool" -name libpdfium.so -type f | head -1)
          test -n "$pdfium"
          echo "PDFIUM_PATH=$pdfium" >> "$GITHUB_ENV"
      - name: Folder, local conversation, real PDF and read-only HA regressions
        run: flutter test test/offline_folder_library_test.dart test/offline_pdf_native_test.dart test/offline_local_chat_test.dart test/ha_read_client_test.dart test/folder_knowledge_page_test.dart test/document_text_test.dart test/zim_test.dart test/archive_regressions_test.dart test/knowledge_test.dart test/l10n_test.dart test/native_loader_test.dart
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Android integration without APK
        run: bash scripts/check_android_host.sh
