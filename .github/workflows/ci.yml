name: PALA 0.3.4 integrated source validation (no APK)
on:
  push:
    branches: [pala/integrated-034-2026-11-17]
    paths: ['lib/**', 'test/**', 'android/**', 'scripts/**', 'pubspec*', '.github/workflows/ci.yml']
  workflow_dispatch:
    inputs:
      format_only:
        description: Format reviewed Dart files and return a source patch; no tests or APK
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pala-034-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  format:
    if: inputs.format_only == true || contains(github.event.head_commit.message, '[format-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - name: Format only the reviewed 0.3.3 Dart delta
        run: |
          mapfile -t changed < <(git diff --name-only cae3ac12b0719212109c7b0fd6c0fe85c85c19c3 HEAD -- '*.dart')
          if ((${#changed[@]})); then dart format "${changed[@]}"; fi
          git diff --binary -- '*.dart' > "$RUNNER_TEMP/pala-033-format.patch"
      - name: Print formatter patch for GitHub-only review
        run: |
          echo 'PALA_FORMAT_PATCH_BEGIN'
          cat "$RUNNER_TEMP/pala-033-format.patch"
          echo 'PALA_FORMAT_PATCH_END'
      - uses: actions/upload-artifact@v4
        with:
          name: PALA-033-reviewed-format-patch
          path: ${{ runner.temp }}/pala-033-format.patch
          retention-days: 7
  baseline:
    if: inputs.format_only != true && !contains(github.event.head_commit.message, '[format-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 78009a6f2d91ef56942bd929b3f2f289da1d212e
      - uses: actions/checkout@v4
        with:
          path: validation-tests
      - name: Use explicit system-locale fixture and Persian acceptance checks
        run: |
          cp validation-tests/test/l10n_test.dart test/l10n_test.dart
          cp validation-tests/test/persian_overlay_test.dart test/persian_overlay_test.dart
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - name: Validate restored Persian baseline and existing model/native contracts
        run: flutter test test/l10n_test.dart test/persian_overlay_test.dart test/native_load_settings_test.dart test/native_loader_test.dart test/model_load_progress_test.dart test/model_memory_test.dart
  mvp:
    needs: baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check_offline_baseline.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - name: Check formatting of the PALA development Dart changes
        run: |
          mapfile -t changed < <(git diff --name-only cae3ac12b0719212109c7b0fd6c0fe85c85c19c3 HEAD -- '*.dart')
          if ((${#changed[@]})); then dart format --output=none --set-exit-if-changed "${changed[@]}"; fi
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Prepare the locked PDFium native asset for the Linux test runner
        run: |
          dart run scripts/prepare_pdfium_assets.dart
          pdfium=$(find "$PWD/.dart_tool" -name libpdfium.so -type f | head -1)
          test -n "$pdfium"
          echo "PDFIUM_PATH=$pdfium" >> "$GITHUB_ENV"
      - name: Folder, local conversation, real PDF and read-only HA regressions
        run: flutter test test/pala_memory_admission_test.dart test/zim_image_selection_test.dart test/zim_inline_gallery_test.dart test/zim_indexed_project_search_test.dart test/zim_index_service_test.dart test/zim_index_storage_test.dart test/zim_query_translation_test.dart test/zim_index_step_test.dart test/zim_content_index_test.dart test/zim_content_batches_test.dart test/memory_history_scan_test.dart test/project_tabs_test.dart test/citation_match_test.dart test/chat_test.dart test/voice_settings_test.dart test/voice_engine_selection_test.dart test/voice_pipeline_test.dart test/persian_voice_routing_test.dart test/persian_stt_policy_test.dart test/hourly_pattern_test.dart test/ha_hourly_statistics_test.dart test/ha_historical_coverage_test.dart test/offline_sensor_reliability_test.dart test/offline_zim_reliability_test.dart test/offline_zim_chat_test.dart test/offline_upgrade_compatibility_test.dart test/offline_folder_library_test.dart test/offline_pdf_native_test.dart test/offline_local_chat_test.dart test/ha_read_client_test.dart test/ha_sensor_language_test.dart test/live_time_answer_test.dart test/folder_knowledge_page_test.dart test/document_text_test.dart test/zim_test.dart test/archive_regressions_test.dart test/knowledge_test.dart test/l10n_test.dart test/native_loader_test.dart test/app_dialog_test.dart test/chat_widgets_test.dart
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Android integration without APK
        run: bash scripts/check_android_host.sh
