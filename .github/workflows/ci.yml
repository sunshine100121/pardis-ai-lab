name: PALA offline MVP validation and gated upgrade
on:
  push:
    branches: [pala/review-033-2026-11-16]
    paths: ['lib/**', 'test/**', 'android/**', 'scripts/**', 'pubspec*', '.github/workflows/ci.yml']
  workflow_dispatch:
    inputs:
      signing_check:
        description: Verify existing owner key against the installed-reference APK; no APK build
        type: boolean
        default: false
      build_apk:
        description: Build one in-place upgrade only after validation and owner signing proof pass
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pala-offline-mvp-validation
  cancel-in-progress: false
jobs:
  baseline:
    if: inputs.signing_check != true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 78009a6f2d91ef56942bd929b3f2f289da1d212e
      - uses: actions/checkout@v4
        with:
          path: validation-tests
      - name: Use explicit system-locale fixture and Persian acceptance checks
        run: |
          cp validation-tests/test/l10n_test.dart test/l10n_test.dart
          cp validation-tests/test/persian_overlay_test.dart test/persian_overlay_test.dart
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - name: Validate restored Persian baseline and existing model/native contracts
        run: flutter test test/l10n_test.dart test/persian_overlay_test.dart test/native_load_settings_test.dart test/native_loader_test.dart test/model_load_progress_test.dart test/model_memory_test.dart
  mvp:
    needs: baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check_offline_baseline.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Check formatting of the 0.3.3 Dart changes
        run: |
          mapfile -t changed < <(git diff --name-only cae3ac12b0719212109c7b0fd6c0fe85c85c19c3 HEAD -- '*.dart')
          if ((${#changed[@]})); then dart format --output=none --set-exit-if-changed "${changed[@]}"; fi
      - name: Prepare the locked PDFium native asset for the Linux test runner
        run: |
          dart run scripts/prepare_pdfium_assets.dart
          pdfium=$(find "$PWD/.dart_tool" -name libpdfium.so -type f | head -1)
          test -n "$pdfium"
          echo "PDFIUM_PATH=$pdfium" >> "$GITHUB_ENV"
      - name: Folder, local conversation, real PDF and read-only HA regressions
        run: flutter test test/voice_pipeline_test.dart test/persian_voice_routing_test.dart test/hourly_pattern_test.dart test/ha_hourly_statistics_test.dart test/offline_sensor_reliability_test.dart test/offline_zim_reliability_test.dart test/offline_zim_chat_test.dart test/offline_upgrade_compatibility_test.dart test/offline_folder_library_test.dart test/offline_pdf_native_test.dart test/offline_local_chat_test.dart test/ha_read_client_test.dart test/folder_knowledge_page_test.dart test/document_text_test.dart test/zim_test.dart test/archive_regressions_test.dart test/knowledge_test.dart test/l10n_test.dart test/native_loader_test.dart
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Android integration without APK
        run: bash scripts/check_android_host.sh
  signing:
    if: inputs.signing_check == true || inputs.build_apk == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact installed-reference artifact and package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/sunshine100121/pardis-ai-lab/actions/artifacts/14137906490/zip > "$RUNNER_TEMP/previous.zip"
          echo "870580e1f6f5cec5a9cebfffe779979cdcbc2977db04635cdf404cf2ed293a32  $RUNNER_TEMP/previous.zip" | sha256sum -c -
          mkdir "$RUNNER_TEMP/previous-apk"
          unzip -j "$RUNNER_TEMP/previous.zip" app-release.apk -d "$RUNNER_TEMP/previous-apk"
          apk="$RUNNER_TEMP/previous-apk/app-release.apk"
          echo "9f6e58baa4ece1a4883a8ce6c2bd4e96e1aa3ed707fd9038cfc69736c3286b66  $apk" | sha256sum -c -
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$aapt" dump badging "$apk" > baseline-info.txt
          grep -F "package: name='ir.pardis.ai.pala.f1diag2' versionCode='5' versionName='0.3.2'" baseline-info.txt
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs "$apk" > baseline-signing.txt
          grep -F c8e89c07b45ed7789cf2e5484180a7d423d2a5e2040e1ac2a4192f0f14d1eb52 baseline-signing.txt
      - name: Prove owner private key and certificate match before version bump
        env:
          PALA_F1_KEYSTORE_BASE64: ${{ secrets.PALA_F1_KEYSTORE_BASE64 }}
          PALA_F1_KEYSTORE_PASSWORD: ${{ secrets.PALA_F1_KEYSTORE_PASSWORD }}
          PALA_F1_KEY_ALIAS: ${{ secrets.PALA_F1_KEY_ALIAS }}
          PALA_F1_KEY_PASSWORD: ${{ secrets.PALA_F1_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          java scripts/CheckUpgradeSigner.java | tee signing-preflight.json
      - uses: actions/upload-artifact@v4
        with:
          name: PALA-upgrade-signing-preflight
          path: |
            signing-preflight.json
            baseline-info.txt
            baseline-signing.txt
  upgrade:
    if: github.event_name == 'workflow_dispatch' && inputs.build_apk == true && inputs.signing_check != true
    needs: [baseline, mvp, signing]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check_offline_baseline.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - name: Configure only the verified permanent owner signer
        env:
          PALA_F1_KEYSTORE_BASE64: ${{ secrets.PALA_F1_KEYSTORE_BASE64 }}
          PALA_F1_KEYSTORE_PASSWORD: ${{ secrets.PALA_F1_KEYSTORE_PASSWORD }}
          PALA_F1_KEY_ALIAS: ${{ secrets.PALA_F1_KEY_ALIAS }}
          PALA_F1_KEY_PASSWORD: ${{ secrets.PALA_F1_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          java scripts/CheckUpgradeSigner.java
          keystore="$RUNNER_TEMP/pala-owner-upgrade.p12"
          umask 077
          printf '%s' "$PALA_F1_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          {
            printf 'ODLLM_ANDROID_KEYSTORE_PATH=%s\n' "$keystore"
            printf 'ODLLM_ANDROID_STORE_PASSWORD=%s\n' "$PALA_F1_KEYSTORE_PASSWORD"
            printf 'ODLLM_ANDROID_KEY_ALIAS=%s\n' "$PALA_F1_KEY_ALIAS"
            printf 'ODLLM_ANDROID_KEY_PASSWORD=%s\n' "$PALA_F1_KEY_PASSWORD"
            printf 'ODLLM_REQUIRE_RELEASE_SIGNING=true\n'
          } >> "$GITHUB_ENV"
      - name: Build the single in-place upgrade APK
        run: |
          grep -Fx 'version: 0.3.3+6' pubspec.yaml
          bash scripts/build_android.sh
      - name: Verify APK identity, version and exact owner certificate
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$aapt" dump badging "$apk" > build/app/outputs/flutter-apk/upgrade-package.txt
          grep -F "package: name='ir.pardis.ai.pala.f1diag2' versionCode='6' versionName='0.3.3'" build/app/outputs/flutter-apk/upgrade-package.txt
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs "$apk" > build/app/outputs/flutter-apk/upgrade-signing.txt
          grep -F c8e89c07b45ed7789cf2e5484180a7d423d2a5e2040e1ac2a4192f0f14d1eb52 build/app/outputs/flutter-apk/upgrade-signing.txt
          if unzip -Z1 "$apk" | grep -Ei '\.(p12|jks|keystore)$'; then echo 'Private signing file must not be packaged' >&2; exit 1; fi
          sha256sum "$apk" > build/app/outputs/flutter-apk/app-release.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PALA-Offline-MVP-0.3.3-upgrade-v6
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.sha256
            build/app/outputs/flutter-apk/upgrade-package.txt
            build/app/outputs/flutter-apk/upgrade-signing.txt
      - name: Remove temporary owner key
        if: always()
        run: rm -f "$RUNNER_TEMP/pala-owner-upgrade.p12"
