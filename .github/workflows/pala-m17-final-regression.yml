name: PALA M17 final broad chat baseline comparison (no device or APK)
on:
  push:
    branches: [pala/m17-persian-image-understanding-2026-11-20]
    paths: ['.github/workflows/pala-m17-final-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-chat-regressions:
    name: Compare full chat_test on ${{ matrix.checkpoint }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        checkpoint: [m15-baseline, m17-candidate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.checkpoint == 'm15-baseline' && 'b24e31dcb69a53b29f145b5e59a23ec864c5b53c' || 'pala/m17-persian-image-understanding-2026-11-20' }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
      - name: Run unchanged complete chat_test.dart; record failures without suppressing
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded test/chat_test.dart > "$RUNNER_TEMP/chat-regressions.txt" 2>&1
          status=$?
          set -e
          python3 - "$RUNNER_TEMP/chat-regressions.txt" <<'PY'
          import re, sys
          rows = open(sys.argv[1], encoding='utf-8', errors='replace').read().splitlines()
          failures = []
          for row in rows:
              if '❌' in row and '(failed)' in row:
                  failures.append(row.split('❌',1)[1].replace(' (failed)', '').strip())
          print('FULL_CHAT_FAILING_TEST_COUNT=' + str(len(failures)))
          print('FULL_CHAT_FAILED_NAMES_BEGIN')
          for name in failures:
              print(name)
          print('FULL_CHAT_FAILED_NAMES_END')
          for row in rows[-18:]:
              print(row)
          PY
          exit "$status"
