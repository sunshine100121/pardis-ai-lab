      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Build Android ARM64 APK with Persian UI
        shell: bash
        run: bash scripts/build_android.sh
      - name: Verify APK name, package and native CPU library
        shell: bash
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          test -s lib/l10n/app_localizations_fa.dart
          grep -Fq "پالا" lib/l10n/app_localizations_fa.dart
          unzip -Z1 "$apk" | grep -Fx 'lib/arm64-v8a/libondevice_llm_cpu_i8mm.so'
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$aapt"
          "$aapt" dump badging "$apk" | tee /tmp/pala_badging.txt
          grep -Fq "package: name='ir.pardis.ai.pala'" /tmp/pala_badging.txt
          grep -Fq "application-label:'پالا | PALA'" /tmp/pala_badging.txt
          sha256sum "$apk" | tee /tmp/pala_apk.sha256
      - name: Upload 0.2.0 test APK
        uses: actions/upload-artifact@v4
        with:
          name: PALA-0.2.0-FA-ARM64-test-only
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
