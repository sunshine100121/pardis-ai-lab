          for key, value in translations.items():
              if key not in en or not isinstance(en[key], str):
                  raise RuntimeError(f'PALA translation key is absent: {key}')
              # Preserve the exact variable names in ICU messages; other 2,000+ keys
              # retain their original English text to prevent malformed placeholders.
              original_vars = set(re.findall(r'\{([A-Za-z_]\w*)\}', en[key]))
              new_vars = set(re.findall(r'\{([A-Za-z_]\w*)\}', value))
              if original_vars != new_vars:
                  raise RuntimeError(f'Placeholder mismatch: {key}: {original_vars} / {new_vars}')
              fa[key] = value
          Path('lib/l10n/app_fa.arb').write_text(json.dumps(fa, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'PALA Persian UI overlay applied: {len(translations)} translated keys, {sum(not k.startswith("@") for k in en)} total keys. English fallback retained.')
