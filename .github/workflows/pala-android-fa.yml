name: PALA - Persian Android APK 0.2.0 (test)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pala-fa-bootstrap
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout pinned upstream source (not fork main)
        uses: actions/checkout@v4
        with:
          repository: sebytzr16/on-device-llm
          ref: b848d9920e59b0af7bed6d1d335ece6652987cc1
          persist-credentials: false
      - name: Verify pinned source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "b848d9920e59b0af7bed6d1d335ece6652987cc1"
          test -f LICENSE
          test -f scripts/build_android.sh
          test -f lib/l10n/app_en.arb
      - name: Apply PALA Persian UI overlay (fail closed)
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json
          import re
          from pathlib import Path
          
          
          def replace_one(name, before, after):
              p = Path(name)
              contents = p.read_text(encoding='utf-8')
              count = contents.count(before)
              if count != 1:
                  raise RuntimeError(f'PALA overlay refused {name}: expected one anchor, got {count}')
              p.write_text(contents.replace(before, after, 1), encoding='utf-8')
          
          # Independent ID: do not attempt a same-ID update to 0.1.0. Its throwaway
          # GitHub runner signing key cannot be assumed to match subsequent builds.
          replace_one('android/app/build.gradle.kts',
              'applicationId = if (nativeProps.getProperty("smoke", "false") == "true") "app.ondevicellm.ondevice_llm.smoke" else "app.ondevicellm.ondevice_llm"',
              'applicationId = if (nativeProps.getProperty("smoke", "false") == "true") "ir.pardis.ai.pala.smoke" else "ir.pardis.ai.pala"')
          replace_one('android/app/src/main/AndroidManifest.xml', 'android:label="OnDevice LLM"', 'android:label="پالا | PALA"')
          replace_one('android/app/src/main/res/values/strings.xml', '<string name="process_text_label">Ask OnDevice LLM</string>', '<string name="process_text_label">از پالا بپرس</string>')
          replace_one('android/app/src/main/res/values/strings.xml', '<string name="tile_label">Talk to OnDevice LLM</string>', '<string name="tile_label">گفت‌وگو با پالا</string>')
          replace_one('pubspec.yaml', 'version: 1.2.0+5', 'version: 0.2.0+2')
          replace_one('lib/app.dart', "title: 'OnDevice LLM'", "title: 'پالا | PALA'")
          replace_one('lib/features/chat/presentation/widgets/chat_title.dart', "text: ' LLM'", "text: ' | PALA'")
          replace_one('lib/core/l10n/l10n.dart', "const supportedLanguageCodes = ['', 'en', 'fr', 'es'];", "const supportedLanguageCodes = ['', 'fa', 'en', 'fr', 'es'];")
          replace_one('lib/features/settings/domain/entities/inference_settings.dart', "this.localeCode = '',", "this.localeCode = 'fa',")
          replace_one('lib/features/settings/domain/entities/inference_settings.dart', "const {'en', 'fr', 'es'}.contains(text('localeCode', 8))", "const {'fa', 'en', 'fr', 'es'}.contains(text('localeCode', 8))")
          replace_one('lib/features/settings/presentation/screens/settings_screen.dart',
              "'es' => context.l10n.languageSpanish,", "'es' => context.l10n.languageSpanish,\n                                'fa' => 'فارسی',")
          # Build script runs bootstrap (flutter pub get), then regenerates l10n classes.
          replace_one('scripts/build_android.sh', 'bash scripts/bootstrap.sh\n', 'bash scripts/bootstrap.sh\nflutter gen-l10n\n')
          
          p = Path('lib/l10n/app_en.arb')
          en = json.loads(p.read_text(encoding='utf-8'))
          fa = dict(en)
          fa['@@locale'] = 'fa'
          translations = {'appTitle': 'پالا', 'noModelLoaded': 'مدلی بارگذاری نشده است', 'newChat': 'گفت\u200cوگوی جدید', 'drawerTemporary': 'موقت', 'drawerWorkspace': 'فضای کاری', 'drawerProjects': 'پروژه\u200cها و گفت\u200cوگوها', 'drawerProjectsHint': 'پروژه\u200cها، بایگانی و سطل زباله', 'previous7Days': '۷ روز گذشته', 'previous30Days': '۳۰ روز گذشته', 'olderChats': 'قدیمی\u200cتر', 'chatOptions': 'گزینه\u200cهای گفت\u200cوگو', 'shareOrExport': 'اشتراک\u200cگذاری یا خروجی گرفتن', 'thisChatSection': 'این گفت\u200cوگو', 'conversations': 'گفت\u200cوگوها', 'more': 'بیشتر', 'exportMarkdown': 'خروجی Markdown', 'exportJson': 'خروجی JSON', 'shareAsText': 'اشتراک\u200cگذاری به\u200cصورت متن', 'createDocument': 'ساخت سند', 'documentFormat': 'قالب', 'answersOnly': 'فقط پاسخ\u200cهای دستیار', 'includeBranches': 'شامل نسخه\u200cهای قبلی پاسخ', 'includeReasoning': 'شامل فرایند استدلال مدل', 'saveDocument': 'ذخیره سند', 'models': 'مدل\u200cها', 'settings': 'تنظیمات', 'metrics': 'آمار عملکرد', 'loadingModel': 'در حال بارگذاری مدل در حافظه…', 'messageHint': 'پیامتان را بنویسید…', 'listening': 'در حال شنیدن…', 'chooseModel': 'انتخاب مدل', 'send': 'ارسال پیام', 'stop': 'توقف تولید پاسخ', 'attachTooltip': 'افزودن عکس یا فایل، یا انتخاب ابزار', 'dictate': 'گفتار به نوشتار', 'stopDictation': 'توقف گفتار به نوشتار', 'modelPill': 'مدل', 'webLocal': 'محلی', 'webAuto': 'خودکار', 'webAlways': 'همیشه', 'emptyTitle': 'هوشمندی بیشتر، حریم خصوصی بهتر.', 'emptyHasModel': 'مدل روی همین دستگاه اجرا می\u200cشود. هرچه می\u200cخواهید بپرسید.', 'emptyNoModel': 'هنوز مدلی ندارید. از بخش مدل\u200cها، مدل آماده\u200cای دریافت کنید یا فایل GGUF خود را وارد کنید.', 'askPhoto': 'پرسش درباره عکس', 'askFile': 'پرسش درباره فایل', 'generating': 'در حال تولید پاسخ…', 'runDetails': 'جزئیات ساخت پاسخ', 'answerWarning': 'ابهام\u200cهای بررسی منابع', 'copyRunDetails': 'کپی جزئیات پاسخ', 'runDetailsCopied': 'جزئیات کپی شد', 'runMeasured': 'اندازه\u200cگیری\u200cشده', 'runSettings': 'تنظیمات فعال', 'runEngine': 'موت