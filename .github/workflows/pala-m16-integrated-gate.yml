name: PALA M01-M06 unified source gates and one guarded 0.3.5 signed trial APK
on:
  # One-shot source validation. Future source/docs changes do not trigger CI again.
  push:
    branches: [pala/m16-release-gate-034-2026-11-21, pala/m01-m06-unified-device-trial-2026-11-23]
    paths:
      - docs/PALA_M16_ONE_SHOT_CI_2026-11-21.trigger
      - docs/PALA_M16_FORMAT_ONLY_2026-11-21.trigger
      - docs/PALA_M16_SIGN_ONLY_2026-11-21.trigger
      - docs/PALA_M16_BUILD_ONCE_2026-11-21.trigger
      - docs/PALA_M01_M06_ONE_SHOT_2026-11-23.trigger
      - docs/PALA_M01_M06_NATIVE_ONLY_RETRY_2026-11-23.trigger
      - docs/PALA_M01_M06_MAVEN_CANONICAL_FALLBACK_2026-11-23.trigger
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pala-m16-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  m01-m06-unified-one-shot:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/pala/m01-m06-unified-device-trial-2026-11-23' && contains(github.event.head_commit.message, '[m01m06-preflight]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - name: Verify identity and get exact dependency lock
        run: |
          set -euo pipefail
          test "$(sed -n 's/^version: //p' pubspec.yaml)" = '0.3.5+8'
          grep -Fq 'applicationId = "ir.pardis.ai.pala.f1diag2"' android/app/build.gradle.kts
          flutter pub get
          dart format lib/features/knowledge/folder_library.dart lib/features/zim/zim_archive.dart lib/features/zim/zim_article_page.dart lib/features/zim/zim_local_video.dart lib/features/zim/zim_subtitles.dart lib/features/zim/zim_video_page.dart lib/features/zim/zim_video_runtime.dart lib/features/zim/zim_video_selection.dart test/zim_video_subtitles_test.dart
          python3 scripts/check_offline_baseline.py
          git add pubspec.lock lib/features/knowledge/folder_library.dart lib/features/zim/zim_archive.dart lib/features/zim/zim_article_page.dart lib/features/zim/zim_local_video.dart lib/features/zim/zim_subtitles.dart lib/features/zim/zim_video_page.dart lib/features/zim/zim_video_runtime.dart lib/features/zim/zim_video_selection.dart test/zim_video_subtitles_test.dart
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(pala-m01-m06): pin video plugin and format reviewed Dart [skip ci]'
            git push origin HEAD:refs/heads/pala/m01-m06-unified-device-trial-2026-11-23
          fi
      - name: Verify installed-data baseline, exact lock and application
        run: |
          set -euo pipefail
          python3 scripts/check_offline_baseline.py
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run combined M01–M06 regression tests
        run: |
          set -euo pipefail
          dart run scripts/prepare_pdfium_assets.dart
          pdfium=$(find "$PWD/.dart_tool" -name libpdfium.so -type f | head -1)
          test -n "$pdfium"
          export PDFIUM_PATH="$pdfium"
          flutter test --concurrency=1 test/zim_video_subtitles_test.dart test/zim_test.dart test/zim_inline_gallery_test.dart test/zim_source_scope_test.dart test/zim_indexed_project_search_test.dart test/zim_multilingual_source_route_test.dart test/pdf_ocr_models_test.dart test/pdf_page_index_test.dart test/offline_folder_library_test.dart test/project_tabs_test.dart test/citation_match_test.dart test/offline_upgrade_compatibility_test.dart
      - name: Android compilation without creating APK
        run: bash scripts/check_android_host.sh
      - name: Record gate boundary
        run: |
          echo 'SOURCE_GATE=PASS; APK_BUILT=NO; INSTALLED=NO'
          echo 'REAL_TABLET_BACKUP_SIGNER_VIDEO_QUALITY=NOT_VERIFIED'

  m01-m06-android-only-retry:
    # Source tests and analyzer already passed on the locked M01-M06 commit.
    # Only Gradle's Maven download received HTTP 429; never rebuild APK.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/pala/m01-m06-unified-device-trial-2026-11-23' && contains(github.event.head_commit.message, '[m01m06-android-only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - name: Verify exact previously-accepted code and lock
        run: |
          set -euo pipefail
          python3 scripts/check_offline_baseline.py
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
          test "$(sed -n 's/^version: //p' pubspec.yaml)" = '0.3.5+8'
      - name: Compile Android host, retry only Maven rate limits
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            set +e
            bash scripts/check_android_host.sh 2>&1 | tee "$RUNNER_TEMP/pala-android-gradle.log"
            code=${PIPESTATUS[0]}
            set -e
            if ((code == 0)); then
              echo 'ANDROID_HOST_COMPILE=PASS; APK=NO'
              exit 0
            fi
            if ((attempt == 2)) || ! grep -Eq 'status code 429|Too Many Requests' "$RUNNER_TEMP/pala-android-gradle.log"; then
              echo 'ANDROID_HOST_COMPILE=NOT_VERIFIED; REAL_COMPILATION_FAILURE_OR_MAVEN_RATE_LIMIT' >&2
              exit "$code"
            fi
            echo 'TRANSIENT_MAVEN_429: wait before single retry; NO_SOURCE_CHANGE'
            sleep 55
          done

  m01-m06-maven-canonical-fallback:
    # Gradle network-only recovery; exact signed release will use the M16 job.
    if: \${{ github.event_name == 'push' && github.ref == 'refs/heads/pala/m01-m06-unified-device-trial-2026-11-23' && contains(github.event.head_commit.message, '[m01m06-maven-fallback]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - name: Baseline and exact locked dependencies
        run: |
          set -euo pipefail
          test "$(sed -n 's/^version: //p' pubspec.yaml)" = '0.3.5+8'
          python3 scripts/check_offline_baseline.py
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Gradle temporary official Maven Central alternate host; never modify repository
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ('android/settings.gradle.kts','android/build.gradle.kts'):
              p=Path(name)
              original=p.read_text()
              assert original.count('mavenCentral()')==1, f'UNEXPECTED_GRADLE_REPOS:{name}'
              p.write_text(original.replace(
                  'mavenCentral()',
                  'maven { url = uri("https://repo1.maven.org/maven2") }'
              ))
          PY
          echo 'ONLY_EPHEMERAL_BUILD_REPOSITORY_URL_CHANGED; SOURCE_AND_RELEASE_UNTOUCHED'
          curl --fail --silent --show-error --location --head --max-time 15 https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.2.0/kotlin-stdlib-2.2.0.pom >/dev/null
      - name: Compile Android Kotlin host without APK
        run: |
          set -euo pipefail
          bash scripts/check_android_host.sh
          echo 'M01_M06_ANDROID_HOST_COMPILE=PASS; NO_APK; NO_INSTALL'

  integrated-source-gate:
    if: ${{ !contains(github.event.head_commit.message, '[m16-format-only]') && !contains(github.event.head_commit.message, '[m16-sign-only]') && !contains(github.event.head_commit.message, '[m16-build-once]') && !contains(github.event.head_commit.message, '[m01m06-preflight]') && !contains(github.event.head_commit.message, '[m01m06-android-only]') && !contains(github.event.head_commit.message, '[m01m06-maven-fallback]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required for existing baseline and installed-reference commit checks
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - name: Inspect release identifiers without exposing signing material
        run: |
          grep '^version:' pubspec.yaml
          grep 'applicationId = ' android/app/build.gradle.kts
          test "$(sed -n 's/^version: //p' pubspec.yaml)" = '0.3.5+8'
          grep -q 'applicationId = "ir.pardis.ai.pala.f1diag2"' android/app/build.gradle.kts
          echo 'SOURCE_VERSION_ONLY_0.3.5+8; NO_APK_IN_SOURCE_GATE'
      - name: Verify committed source, dependencies and storage BEFORE any generator
        run: python3 scripts/check_offline_baseline.py
      - name: Resolve only exact committed dependency versions
        run: flutter pub get --enforce-lockfile
      - name: Refuse silent dependency changes during code generation
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          if ! git diff --quiet -- pubspec.lock; then
            echo 'LOCKFILE_CHANGED_BY_BUILD_TOOLS; inspect exact dependency drift, do not reset silently' >&2
            git diff -- pubspec.lock
            exit 1
          fi
      - name: Audit formatting debt without masking release failure
        id: formatting
        continue-on-error: true
        run: |
          mapfile -t changed < <(git diff --name-only cae3ac12b0719212109c7b0fd6c0fe85c85c19c3 HEAD -- '*.dart' | grep -E '^(lib/|test/)' || true)
          if (("${#changed[@]}" > 0)); then dart format --output=none --set-exit-if-changed "${changed[@]}"; fi
      - name: Analyze full integrated Dart code
        id: analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Prepare existing locked PDFium asset for Linux fixture tests
        run: |
          dart run scripts/prepare_pdfium_assets.dart
          pdfium=$(find "$PWD/.dart_tool" -name libpdfium.so -type f | head -1)
          test -n "$pdfium"
          echo "PDFIUM_PATH=$pdfium" >> "$GITHUB_ENV"
      - name: Missions 9-19 plus data, security, offline and upgrade checks
        id: tests
        continue-on-error: true
        run: |
          flutter test --concurrency=1 \
            test/conversation_voice_policy_test.dart \
            test/voice_engine_selection_test.dart \
            test/persian_voice_routing_test.dart \
            test/persian_stt_quality_test.dart \
            test/voice_pipeline_test.dart \
            test/m11_memory_approval_test.dart \
            test/m11_memory_persian_test.dart \
            test/m11_memory_policy_test.dart \
            test/m11_project_expiry_test.dart \
            test/m11_project_memory_expiry_ui_test.dart \
            test/m12_project_scope_test.dart \
            test/m13_internet_policy_test.dart \
            test/m13_project_public_web_query_test.dart \
            test/m14_ha_doctor_test.dart \
            test/m14_ha_doctor_readouts_test.dart \
            test/m15_lan_probe_test.dart \
            test/benchmark_test.dart \
            test/m17_vision_safety_test.dart \
            test/m18_feedback_health_test.dart \
            test/m18_feedback_widget_test.dart \
            test/m19_controlled_learning_test.dart \
            test/m19_learning_widgets_test.dart \
            test/offline_upgrade_compatibility_test.dart \
            test/offline_folder_library_test.dart \
            test/ha_read_client_test.dart \
            test/zim_indexed_project_search_test.dart \
            test/project_tabs_test.dart \
            test/chat_test.dart
      - name: Android host compilation check only - NEVER build APK
        id: android
        continue-on-error: true
        run: bash scripts/check_android_host.sh
      - name: Generate optional formatting-only patch AFTER other diagnostics
        if: ${{ always() && steps.formatting.outcome == 'failure' }}
        run: |
          mapfile -t changed < <(git diff --name-only cae3ac12b0719212109c7b0fd6c0fe85c85c19c3 HEAD -- '*.dart' | grep -E '^(lib/|test/)' || true)
          if (("${#changed[@]}" > 0)); then dart format "${changed[@]}"; fi
          git diff --binary -- lib/ test/ > "$RUNNER_TEMP/pala-m16-format-only.patch"
          test -s "$RUNNER_TEMP/pala-m16-format-only.patch"
          echo 'FORMAT_PATCH_GENERATED_ONLY_IN_CI; NOT_APPLIED_TO_REPOSITORY'
      - name: Upload inspectable formatting patch
        if: ${{ always() && steps.formatting.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: PALA-M16-formatting-only-patch
          path: ${{ runner.temp }}/pala-m16-format-only.patch
          retention-days: 14
      - name: Evaluate all diagnostics without claiming a false PASS
        if: always()
        env:
          FORMAT_RESULT: ${{ steps.formatting.outcome }}
          ANALYZE_RESULT: ${{ steps.analyze.outcome }}
          TESTS_RESULT: ${{ steps.tests.outcome }}
          ANDROID_RESULT: ${{ steps.android.outcome }}
        run: |
          echo "FORMAT=$FORMAT_RESULT ANALYZE=$ANALYZE_RESULT TESTS=$TESTS_RESULT ANDROID=$ANDROID_RESULT"
          echo 'APK_CREATED=NO'
          echo 'SIGNING_CERTIFICATE_MATCH=NOT_VERIFIED'
          echo 'BACKUP_RESTORE_ROLLBACK_ON_OWNER_DEVICE=NOT_VERIFIED'
          echo 'POCKET_FARSI_ANDROID_AND_REAL_TAB_ACCEPTANCE=NOT_VERIFIED'
          echo 'RELEASE_APPROVAL=BLOCKED_PENDING_DEVICE_AND_SIGNING_GATES'
          for result in "$FORMAT_RESULT" "$ANALYZE_RESULT" "$TESTS_RESULT" "$ANDROID_RESULT"; do
            if [[ "$result" != success ]]; then
              echo "M16_SOURCE_GATE=FAIL; unresolved check result: $result" >&2
              exit 1
            fi
          done
          echo 'M16_SOURCE_GATE=PASS; RELEASE_STILL_BLOCKED_BY_DEVICE_AND_SIGNING_GATES'

  format-reviewed-source-once:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[m16-format-only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - name: Ensure original owner's installed-data and native contracts
        run: |
          python3 scripts/check_offline_baseline.py
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Only Dart-format reviewed integrated changes, then repin reviewed blobs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only cae3ac12b0719212109c7b0fd6c0fe85c85c19c3 HEAD -- '*.dart' | grep -E '^(lib/|test/)' | grep -v '^lib/l10n/app_localizations' || true)
          if ((${#changed[@]} == 0)); then echo 'NO_REVIEWED_DART_FILES'; exit 1; fi
          # Flutter pub get may update tracked generated l10n in the ephemeral runner.
          # Record its exact diff: formatting must NOT change those generated files.
          generated_before="$(git diff --binary -- 'lib/l10n/app_localizations*' | sha256sum | cut -d ' ' -f1)"
          dart format "${changed[@]}"
          generated_after="$(git diff --binary -- 'lib/l10n/app_localizations*' | sha256sum | cut -d ' ' -f1)"
          test "$generated_before" = "$generated_after" || { echo 'FORMATTER_TOUCHED_GENERATED_L10N' >&2; exit 1; }
          git diff --exit-code -- pubspec.lock
          python3 - <<'PY'
          import pathlib, subprocess, ast
          p=pathlib.Path('scripts/check_offline_baseline.py')
          s=p.read_text()
          tree=ast.parse(s)
          expr=next(n.value for n in tree.body if isinstance(n,ast.Assign) and
              any(isinstance(t,ast.Name) and t.id=='APPROVED_034_BLOBS' for t in n.targets))
          approved=ast.literal_eval(expr)
          for name,old in approved.items():
              new=subprocess.check_output(['git','hash-object',name],text=True).strip()
              if new!=old:
                  needle=f'"{name}": "{old}"'
                  assert s.count(needle)==1, f'PIN_MISMATCH:{name}'
                  s=s.replace(needle,f'"{name}": "{new}"',1)
          p.write_text(s)
          PY
          python3 scripts/check_offline_baseline.py
          git diff --check
          python3 - <<'PY'
          import subprocess
          changes=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          # Existing Flutter-generated l10n drift was recorded and checked
          # before/after formatting; never stage those temporary outputs.
          generated=[p for p in changes if p.startswith('lib/l10n/app_localizations')]
          reviewed=[p for p in changes if p not in generated]
          allowed=lambda p: ((p.startswith('lib/') or p.startswith('test/')) and p.endswith('.dart')) or p=='scripts/check_offline_baseline.py'
          assert reviewed and all(map(allowed,reviewed)),f'UNEXPECTED_CHANGE:{changes}'
          print('FORMATTED_SOURCE_FILES:',sum(p.endswith('.dart') for p in reviewed))
          print('TEMPORARY_GENERATED_L10N_NOT_FOR_COMMIT:',len(generated))
          PY
      - name: Commit reviewed formatter-only changes to the same branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Stage ONLY reviewed Dart sources; never stage Flutter-generated l10n.
          mapfile -t stage_dart < <(git diff --name-only -- lib/ test/ | grep -E '\.dart$' | grep -v '^lib/l10n/app_localizations' || true)
          if (("${#stage_dart[@]}" == 0)); then
            echo 'NO_DART_FORMAT_CHANGES' >&2
            exit 1
          fi
          git add -- "${stage_dart[@]}" scripts/check_offline_baseline.py
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^lib/l10n/app_localizations'; then
            echo 'GENERATED_TRANSLATION_STAGED' >&2
            exit 1
          fi
          git diff --cached --stat
          git commit -m 'style(pala-m16): one-time Dart format plus repinned reviewed blobs [skip ci]'
          # Discard only temporary Flutter-generated output in the disposable runner.
          git restore --worktree -- 'lib/l10n/app_localizations*'
          git diff --exit-code
          # Keep any checkpoint commits added since this run began.
          # No force-push: rebase our single commit on the newest branch head.
          git fetch origin pala/m16-release-gate-034-2026-11-21
          git rebase origin/pala/m16-release-gate-034-2026-11-21
          git push origin HEAD:refs/heads/pala/m16-release-gate-034-2026-11-21

  owner-signer-preflight-only:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[m16-sign-only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prove existing owner private key and expected certificate; no APK
        env:
          PALA_F1_KEYSTORE_BASE64: ${{ secrets.PALA_F1_KEYSTORE_BASE64 }}
          PALA_F1_KEYSTORE_PASSWORD: ${{ secrets.PALA_F1_KEYSTORE_PASSWORD }}
          PALA_F1_KEY_ALIAS: ${{ secrets.PALA_F1_KEY_ALIAS }}
          PALA_F1_KEY_PASSWORD: ${{ secrets.PALA_F1_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # This script only loads the keystore in memory and signs a random
          # challenge; no keystore, password or private key is written to disk.
          java scripts/CheckUpgradeSigner.java
          test "$(sed -n 's/^version: //p' pubspec.yaml)" = '0.3.5+8'
          grep -q 'applicationId = "ir.pardis.ai.pala.f1diag2"' android/app/build.gradle.kts
          echo 'SIGNER_PRIVATE_KEY_AND_HISTORICAL_OWNER_CERTIFICATE=PASS'
          echo 'INSTALLED_0.3.3_CODE6_DEVICE_CERTIFICATE=NOT_VERIFIED'
          echo 'APK_BUILD=NO; INSTALL=NO; RELEASE_APPROVAL=BLOCKED_PENDING_BACKUP_AND_DEVICE_CHECK'

  signed-single-trial-apk:
    # Only the exact owner-approved project branch and a dedicated commit
    # can ask GitHub to build one signed candidate. No device installation.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/pala/m01-m06-unified-device-trial-2026-11-23' && contains(github.event.head_commit.message, '[m16-build-once]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - name: Verify tested code provenance, previous APK contract and exact new version
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 66806b220052505fb7f8e767f790dcdae22b8837 HEAD
          # After 240/240 source tests, only release metadata, workflow,
          # build-identity injection and checkpoints may have changed.
          while IFS= read -r changed; do
            case "$changed" in
              docs/*|.github/workflows/pala-m16-integrated-gate.yml|pubspec.yaml|scripts/build_android.sh|scripts/bootstrap.sh) ;;
              *) echo "UNTESTED_RUNTIME_CHANGE:$changed" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only 66806b220052505fb7f8e767f790dcdae22b8837 HEAD)
          test "$(sed -n 's/^version: //p' pubspec.yaml)" = '0.3.5+8'
          grep -Fq 'applicationId = "ir.pardis.ai.pala.f1diag2"' android/app/build.gradle.kts
          grep -Fq 'ODLLM_REQUIRE_RELEASE_SIGNING' android/app/build.gradle.kts
          grep -Fq 'ODLLM_RELEASE_VERSION' scripts/build_android.sh
          git diff --check
          python3 scripts/check_offline_baseline.py
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
          echo 'RELEASE_SOURCE_AND_COMPATIBILITY=PASS'
      - name: Sign and build exactly one arm64 APK with the existing owner key
        shell: bash
        env:
          PALA_F1_KEYSTORE_BASE64: ${{ secrets.PALA_F1_KEYSTORE_BASE64 }}
          PALA_F1_KEYSTORE_PASSWORD: ${{ secrets.PALA_F1_KEYSTORE_PASSWORD }}
          PALA_F1_KEY_ALIAS: ${{ secrets.PALA_F1_KEY_ALIAS }}
          PALA_F1_KEY_PASSWORD: ${{ secrets.PALA_F1_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          java scripts/CheckUpgradeSigner.java > "$RUNNER_TEMP/pala-owner-signer-proof.json"
          grep -Fq '"owner_key_usable":true' "$RUNNER_TEMP/pala-owner-signer-proof.json"
          keystore="$RUNNER_TEMP/pala-owner-upgrade.p12"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$PALA_F1_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          export ODLLM_ANDROID_KEYSTORE_PATH="$keystore"
          export ODLLM_ANDROID_STORE_PASSWORD="$PALA_F1_KEYSTORE_PASSWORD"
          export ODLLM_ANDROID_KEY_ALIAS="$PALA_F1_KEY_ALIAS"
          export ODLLM_ANDROID_KEY_PASSWORD="$PALA_F1_KEY_PASSWORD"
          export ODLLM_REQUIRE_RELEASE_SIGNING=true
          export ODLLM_RELEASE_VERSION='0.3.5+8'
          export ODLLM_RELEASE_SOURCE="git:${GITHUB_SHA:0:12}"
          bash scripts/build_android.sh
          # No credential material survives this build step.
          git diff --exit-code -- pubspec.lock
          echo 'ONE_ARM64_BUILD_COMPLETED; SIGNED_APK_MUST_STILL_PASS_VERIFICATION'
      - name: Verify package, code 7, owner signature, native arm64 library and no secrets
        shell: bash
        run: |
          set -euo pipefail
          out=build/app/outputs/flutter-apk
          apk="$out/app-release.apk"
          test -s "$apk"
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$aapt"
          test -x "$signer"
          "$aapt" dump badging "$apk" > "$out/upgrade-package.txt"
          grep -Fq "package: name='ir.pardis.ai.pala.f1diag2' versionCode='8' versionName='0.3.5'" "$out/upgrade-package.txt"
          "$signer" verify --verbose --print-certs "$apk" > "$out/upgrade-signing.txt"
          grep -Fiq 'c8e89c07b45ed7789cf2e5484180a7d423d2a5e2040e1ac2a4192f0f14d1eb52' "$out/upgrade-signing.txt"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-members.txt"
          grep -Fxq 'lib/arm64-v8a/libondevice_llm_cpu_i8mm.so' "$RUNNER_TEMP/apk-members.txt"
          if grep -Ei '\.(p12|jks|keystore|gguf)$' "$RUNNER_TEMP/apk-members.txt"; then
            echo 'FORBIDDEN_PRIVATE_KEY_OR_MODEL_FILE_IN_APK' >&2
            exit 1
          fi
          sha256sum "$apk" > "$out/app-release.sha256"
          echo 'OWNER_SIGNATURE_PACKAGE_CODE7_ARM64=PASS'
          echo 'NOT_INSTALLED; LIVE_TABLET_ACCEPTANCE_AND_ROLLBACK_NOT_YET_VERIFIED'
      - name: Upload the single inspectable signed candidate
        uses: actions/upload-artifact@v4
        with:
          name: PALA-0.3.5-code8-unified-signed-trial
          retention-days: 60
          if-no-files-found: error
          compression-level: 0
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.sha256
            build/app/outputs/flutter-apk/upgrade-package.txt
            build/app/outputs/flutter-apk/upgrade-signing.txt
