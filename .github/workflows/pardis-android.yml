name: Pardis AI Lab - independent Android APK (bootstrap)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pal-bootstrap-android
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact upstream source (isolated)
        uses: actions/checkout@v4
        with:
          repository: sebytzr16/on-device-llm
          ref: b848d9920e59b0af7bed6d1d335ece6652987cc1
          persist-credentials: false

      - name: Verify upstream baseline
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "b848d9920e59b0af7bed6d1d335ece6652987cc1"
          test -f LICENSE
          test -f scripts/build_android.sh

      - name: Apply Pardis identity overlay (fail closed)
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          changes = [
          ('android/app/build.gradle.kts', 'applicationId = if (nativeProps.getProperty("smoke", "false") == "true") "app.ondevicellm.ondevice_llm.smoke" else "app.ondevicellm.ondevice_llm"', 'applicationId = if (nativeProps.getProperty("smoke", "false") == "true") "ir.pardis.ai.lab.smoke" else "ir.pardis.ai.lab"'),
          ('android/app/src/main/AndroidManifest.xml', 'android:label="OnDevice LLM"', 'android:label="Pardis AI Lab"'),
          ('android/app/src/main/res/values/strings.xml', '<string name="process_text_label">Ask OnDevice LLM</string>', '<string name="process_text_label">Ask Pardis AI Lab</string>'),
          ('android/app/src/main/res/values/strings.xml', '<string name="tile_label">Talk to OnDevice LLM</string>', '<string name="tile_label">Talk to Pardis AI Lab</string>'),
          ('pubspec.yaml', 'version: 1.2.0+5', 'version: 0.1.0+1'),
          ]
          updates = {}
          for rel, original, replacement in changes:
              path = Path(rel)
              text = updates.get(path, path.read_text(encoding='utf-8'))
              found = text.count(original)
              if found != 1:
                  raise RuntimeError(f'Unsupported upstream content in {rel}: {found} anchors')
              updates[path] = text.replace(original, replacement, 1)
          for path, updated in updates.items():
              path.write_text(updated, encoding='utf-8')
          gradle = Path('android/app/build.gradle.kts').read_text()
          assert 'namespace = "app.ondevicellm.ondevice_llm"' in gradle
          assert '"ir.pardis.ai.lab"' in gradle
          assert 'android:label="Pardis AI Lab"' in Path('android/app/src/main/AndroidManifest.xml').read_text()
          assert 'version: 0.1.0+1' in Path('pubspec.yaml').read_text()
          print('Independent PAL 0.1.0 identity prepared; no upstream app modified.')
          PYCODE
          git diff --check
          git diff --stat

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Build Android ARM64 APK (existing upstream build script)
        shell: bash
        run: bash scripts/build_android.sh

      - name: Verify final APK identity and CPU library
        shell: bash
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          unzip -Z1 "$apk" | grep -Fx 'lib/arm64-v8a/libondevice_llm_cpu_i8mm.so'
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$aapt"
          "$aapt" dump badging "$apk" | tee /tmp/pardis_badging.txt
          grep -Fq "package: name='ir.pardis.ai.lab'" /tmp/pardis_badging.txt
          grep -Fq "application-label:'Pardis AI Lab'" /tmp/pardis_badging.txt
          sha256sum "$apk" | tee /tmp/pardis_apk.sha256

      - name: Upload temporary test APK
        uses: actions/upload-artifact@v4
        with:
          name: Pardis-AI-Lab-0.1.0-ARM64-test-only
          path: |
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
