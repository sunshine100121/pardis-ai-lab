name: PALA Pocket Farsi v2 native ONNX prototype (no APK)

on:
  push:
    branches: [pala/pocket-farsi-v2-android-proto-2026-11-20]
    paths:
      - 'android/**'
      - 'lib/features/voice/pocket_farsi_v2_*.dart'
      - 'test/pocket_farsi_v2_audio_test.dart'
      - '.github/workflows/pala-pocket-g2p-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-kotlin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: flutter pub get
      - name: Format experimental bridges and test and print reviewed delta
        run: |
          dart format lib/features/voice/pocket_farsi_v2_probe.dart lib/features/voice/pocket_farsi_v2_audio.dart test/pocket_farsi_v2_audio_test.dart
          git diff -- lib/features/voice/pocket_farsi_v2_probe.dart lib/features/voice/pocket_farsi_v2_audio.dart test/pocket_farsi_v2_audio_test.dart
      - name: Verify local PCM playback contract and no hidden TTS fallback
        run: flutter test test/pocket_farsi_v2_audio_test.dart
      - name: Compile native Android integration without APK when native code changes
        if: "!contains(github.event.head_commit.message, '[tests-only]')"
        run: bash scripts/check_android_host.sh
